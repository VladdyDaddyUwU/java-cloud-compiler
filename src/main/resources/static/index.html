<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Cloud Compiler</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --accent-hover: #1f6feb;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    .hidden { display: none; }

    /* Auth view */
    .auth-card {
      max-width: 380px; margin: 60px auto; background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px; padding: 28px;
    }
    .auth-card h2 { margin: 0 0 20px; font-size: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .auth-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .auth-buttons button { flex: 1; }
    .auth-msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: var(--danger); }

    /* Runner view */
    .hint {
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; font-size: 13px; color: var(--muted); margin-bottom: 16px;
    }
    .hint code { color: var(--accent); }
    label.editor-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    textarea {
      width: 100%; height: 320px; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 14px;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 14px; line-height: 1.5; resize: vertical; tab-size: 4;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
    button {
      background: var(--accent); color: white; border: none; border-radius: 6px;
      padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover:not(:disabled) { background: var(--panel); }
    .status { font-size: 13px; color: var(--muted); }
    pre {
      background: #010409; border: 1px solid var(--border); border-radius: 6px;
      padding: 14px; font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 14px; line-height: 1.5; min-height: 80px; max-height: 300px;
      overflow: auto; white-space: pre-wrap; word-wrap: break-word; margin: 0;
    }
    .user-info { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Java Cloud Compiler</h1>
      <p>Each run compiles and executes in an isolated, resource-limited Kubernetes Job.</p>
    </div>
    <div class="user-info hidden" id="userInfo">
      <span id="whoami"></span>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>
  </header>

  <main>
    <!-- AUTH VIEW -->
    <div id="authView" class="auth-card">
      <h2>Sign in to run code</h2>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <div class="auth-buttons">
        <button onclick="login()">Log in</button>
        <button class="secondary" onclick="signup()">Sign up</button>
      </div>
      <div class="auth-msg" id="authMsg"></div>
    </div>

    <!-- RUNNER VIEW -->
    <div id="runnerView" class="hidden">
      <div class="hint">
        Your public class must be named <code>Main</code>. Execution is capped at 15s
        and 256Mi memory, and runs with no network access.
      </div>

      <label class="editor-label" for="code">Java source</label>
      <textarea id="code" spellcheck="false">public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from the cloud!");
        int sum = 0;
        for (int i = 1; i <= 10; i++) sum += i;
        System.out.println("Sum 1..10 = " + sum);
    }
}</textarea>

      <div class="controls">
        <button id="runBtn" onclick="runCode()">Run</button>
        <span class="status" id="status"></span>
      </div>

      <label class="editor-label" for="output">Output</label>
      <pre id="output">Output will appear here.</pre>
    </div>
  </main>

  <script>
    // --- View switching ---
    function showRunner(username) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('runnerView').classList.remove('hidden');
      document.getElementById('userInfo').classList.remove('hidden');
      document.getElementById('whoami').textContent = 'Signed in as ' + username;
    }
    function showAuth() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('runnerView').classList.add('hidden');
      document.getElementById('userInfo').classList.add('hidden');
    }

    // --- Auth actions ---
    async function login()  { await doAuth('/api/auth/login'); }
    async function signup() { await doAuth('/api/auth/signup'); }

    async function doAuth(endpoint) {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('authMsg');
      msg.textContent = '';

      if (!username || !password) { msg.textContent = 'Username and password are required.'; return; }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          showRunner(username);
        } else {
          const text = await res.text();
          msg.textContent = text || 'Authentication failed.';
        }
      } catch (e) {
        msg.textContent = 'Request failed: ' + e.message;
      }
    }

    async function logout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (e) { /* ignore */ }
      document.getElementById('password').value = '';
      showAuth();
    }

    // --- Code execution ---
    async function runCode() {
      const code = document.getElementById('code').value;
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const btn = document.getElementById('runBtn');

      btn.disabled = true;
      btn.textContent = 'Running...';
      status.textContent = 'Creating an isolated Job and executing...';
      output.textContent = '';

      const started = Date.now();
      try {
        const res = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ code })
        });
        if (res.status === 401 || res.status === 403) {
          output.textContent = 'Your session has expired. Please log in again.';
          status.textContent = '';
          showAuth();
          return;
        }
        const text = await res.text();
        output.textContent = text || '(no output)';
        const secs = ((Date.now() - started) / 1000).toFixed(1);
        status.textContent = 'Done in ' + secs + 's';
      } catch (e) {
        output.textContent = 'Request failed: ' + e.message;
        status.textContent = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run';
      }
    }
  </script>
</body>
</html>
