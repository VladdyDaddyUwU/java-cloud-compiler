<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Cloud Compiler</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --accent-hover: #1f6feb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    .hint {
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; font-size: 13px; color: var(--muted); margin-bottom: 16px;
    }
    .hint code { color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    textarea {
      width: 100%; height: 320px; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 14px;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 14px; line-height: 1.5; resize: vertical; tab-size: 4;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
    button {
      background: var(--accent); color: white; border: none; border-radius: 6px;
      padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { font-size: 13px; color: var(--muted); }
    pre {
      background: #010409; border: 1px solid var(--border); border-radius: 6px;
      padding: 14px; font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 14px; line-height: 1.5; min-height: 80px; max-height: 300px;
      overflow: auto; white-space: pre-wrap; word-wrap: break-word; margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Java Cloud Compiler</h1>
    <p>Each run compiles and executes in an isolated, resource-limited Kubernetes Job.</p>
  </header>
  <main>
    <div class="hint">
      Your public class must be named <code>Main</code>. Execution is capped at 15s
      and 256Mi memory, and runs with no network access.
    </div>

    <label for="code">Java source</label>
    <textarea id="code" spellcheck="false">public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from the cloud!");
        int sum = 0;
        for (int i = 1; i <= 10; i++) sum += i;
        System.out.println("Sum 1..10 = " + sum);
    }
}</textarea>

    <div class="controls">
      <button id="runBtn" onclick="runCode()">Run</button>
      <span class="status" id="status"></span>
    </div>

    <label for="output">Output</label>
    <pre id="output">Output will appear here.</pre>
  </main>

  <script>
    async function runCode() {
      const code = document.getElementById('code').value;
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const btn = document.getElementById('runBtn');

      btn.disabled = true;
      btn.textContent = 'Running...';
      status.textContent = 'Creating an isolated Job and executing...';
      output.textContent = '';

      const started = Date.now();
      try {
        const res = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });
        const text = await res.text();
        output.textContent = text || '(no output)';
        const secs = ((Date.now() - started) / 1000).toFixed(1);
        status.textContent = 'Done in ' + secs + 's';
      } catch (e) {
        output.textContent = 'Request failed: ' + e.message;
        status.textContent = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run';
      }
    }
  </script>
</body>
</html>
